<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161616" />
    <meta name="description" content="Real Moving Canada — residential, commercial, packing, cleanout, storage and specialty moving services. Moving Your Life Forward." />
    <title>Real Moving Canada — Moving Your Life Forward</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Loading frame shown instantly on a full page load/refresh, replaced when the app mounts. */
      body { margin: 0; background: #F9F9F6; }
      .boot-bar { height: 80px; background: #fff; border-bottom: 1px solid #E4E1DD; display: flex; align-items: center; gap: 14px; padding: 0 clamp(1rem, 3vw, 2rem); }
      .boot-logo { width: 60px; height: 60px; border-radius: 50%; }
      .boot-block { height: min(60vh, 520px); background: #161616; }
      .boot-sk { background: linear-gradient(90deg, #ECE9E5 25%, #F7F5F2 50%, #ECE9E5 75%); background-size: 200% 100%; animation: boot 1.4s linear infinite; border-radius: 6px; }
      @keyframes boot { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-sk { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div aria-hidden="true">
        <div class="boot-bar"><img class="boot-logo" src="/favicon.png" alt="" /><div class="boot-sk" style="width:170px;height:16px"></div></div>
        <div class="boot-block"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
