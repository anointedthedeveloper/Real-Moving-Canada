<!--meta {"title":"Admin Sign In — RealMovingCanada","description":"Administrator sign in.","layout":"app","scripts":["pages/admin-login"],"noindex":true,"output":"admin/login.html"}-->
<main class="login-screen" id="main">
  <div class="login-card">
    <a class="brand" href="/"><img src="/assets/img/logo.svg" alt="RealMovingCanada" width="329" height="44"></a>
    <h1>Admin sign in</h1>
    <p class="muted">For authorized RealMovingCanada staff only.</p>
    <form class="auth-form" id="admin-login" novalidate>
      <div class="form-alert" role="alert"></div>
      <div class="field"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="a-pw">Password</label><div class="pw-wrap"><input id="a-pw" name="password" type="password" autocomplete="current-password" required></div></div>
      <button class="btn btn-dark btn-lg btn-block" type="submit">{{icon:lock}} Sign in</button>
    </form>
    <p class="tiny muted" style="margin:1.5rem 0 0">Sign-in attempts are rate-limited and logged. <a class="link" href="/account?view=forgot">Forgot password?</a></p>
  </div>
</main>
